name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 문서·세션로그·조율판만 바뀐 push 는 배포를 건너뛴다(웹 빌드에 안 들어가는 것들).
    # 매번 [skip ci] 를 손으로 적지 않아도 자동으로 스킵 → 불필요한 배포·실패 메일·큐 경합 감소.
    # (커밋에 코드·에셋이 하나라도 섞이면 정상 배포된다 — 전부 아래 경로에만 걸릴 때만 스킵.)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'session_logs/**'
      - 'ACTIVE_WORK.md'
      - '.gitignore'
  workflow_dispatch:

# GitHub Actions로 Pages에 직접 배포 (Branch 방식 아님).
# repo Settings → Pages → Source: 'GitHub Actions' 선택 필요.

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub 공식 권장값: Pages 배포는 진행 중이면 **취소하지 않고 완주**시킨다(cancel-in-progress: false).
# Pages 배포를 syncing 도중 취소하면 그 배포가 "Deployment failed, try again later" 로 죽고
# 이후 배포까지 연쇄로 실패한다(2026-07-03 확인 — true 로 바꾼 뒤 모든 배포 실패). 큐가 쌓여도
# 하나씩 완주하며, 중간 대기분은 최신만 남고 스킵되므로 손실 없음.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.6-stable
  EXPORT_PRESET: "Web"
  BUILD_DIR: build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot binary
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -L -o godot.zip "$GODOT_URL"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot

      - name: Install export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          TPZ_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          curl -L -o templates.tpz "$TPZ_URL"
          # 템플릿 폴더는 점(.)으로 구분 — "4.6-stable" → "4.6.stable"
          TEMPLATE_VERSION="${GODOT_VERSION/-/.}"
          TARGET="$HOME/.local/share/godot/export_templates/${TEMPLATE_VERSION}"
          mkdir -p "$TARGET"
          unzip -q -o templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$TARGET/"

      - name: Verify export preset exists
        run: |
          if [ ! -f "export_presets.cfg" ]; then
            echo "::error::export_presets.cfg가 없어요. Godot 에디터에서 '${EXPORT_PRESET}' 프리셋을 만들고(Threads Support 끄기) 커밋해야 합니다."
            exit 1
          fi
          if ! grep -q "name=\"${EXPORT_PRESET}\"" export_presets.cfg; then
            echo "::error::export_presets.cfg에 '${EXPORT_PRESET}' 프리셋이 없어요."
            exit 1
          fi

      - name: Import resources
        run: |
          # export 전에 리소스 임포트 - cold 캐시에서 custom_font 등 임포트 의존 리소스를 선해결.
          # 첫 임포트는 임포트 전 리소스 참조로 ERROR 가 찍힐 수 있으나 비치명적(exit 0)이라 || true.
          godot --headless --path . --import || true

      - name: Build Web export
        run: |
          set -e
          mkdir -p "${BUILD_DIR}"
          godot --headless --export-release "${EXPORT_PRESET}" "${BUILD_DIR}/index.html"
          # GitHub Pages는 .nojekyll이 있으면 _ 시작 파일도 서빙
          touch "${BUILD_DIR}/.nojekyll"
          # 로딩 화면 배경(web/loading_*.webp) — pck 밖 정적 파일. head_include JS 가
          # 현지 시각으로 낮/밤을 고른다(.gdignore 폴더라 게임 임포트와 무관).
          cp web/loading_*.webp "${BUILD_DIR}/" 2>/dev/null || true
          ls -la "${BUILD_DIR}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./${{ env.BUILD_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # 세 번 중 성공한 시도의 URL 을 쓴다(앞 시도가 실패하면 그 출력은 비어있음).
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      # GitHub Pages 백엔드 일시 장애("Deployment failed, try again later", ~10초 즉사)는
      # 코드·설정 문제가 아니라 GitHub 측 flaky 라 재실행이 정답(known_issues §89~92).
      # 예전엔 손으로 `gh run rerun --failed` 했지만, 아래처럼 백오프를 두고 최대 3번 자동 재시도한다.
      # → 일시 장애는 조용히 자체 복구(실패 메일 안 옴). 진짜 실패는 3번째까지 실패해 그대로 표면화(메일 옴).
      - name: Deploy to GitHub Pages (1차)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 재시도 전 대기 (20초)
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (2차)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 재시도 전 대기 (45초)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 45

      # 마지막 시도는 continue-on-error 없음 — 여기서도 실패하면 진짜 문제라 잡을 실패시킨다(메일 발송).
      - name: Deploy to GitHub Pages (3차·최종)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
