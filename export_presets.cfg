html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\"><style>html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#111218;}canvas{touch-action:none;-webkit-tap-highlight-color:transparent;display:block;}*{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none;}#status-splash{display:none!important;}#status{background-size:contain;background-position:center;background-repeat:no-repeat;}</style><script>(function(){var A=window.AudioContext||window.webkitAudioContext;if(!A){return;}var L=[];function W(o){var c=new A(o);L.push(c);return c;}W.prototype=A.prototype;window.AudioContext=W;if(window.webkitAudioContext){window.webkitAudioContext=W;}document.addEventListener('visibilitychange',function(){for(var i=0;i<L.length;i++){var p=document.hidden?L[i].suspend():L[i].resume();if(p&&p.catch){p.catch(function(){});}}});})();</script><script>document.addEventListener('DOMContentLoaded',function(){var st=document.getElementById('status');if(!st){return;}var d=document.createElement('div');d.textContent='이 여정은 가로 화면에 맞춰져 있습니다';d.style.cssText='position:absolute;left:0;right:0;bottom:16%;text-align:center;color:rgba(214,178,120,0.85);font:15px serif;letter-spacing:0.06em;text-shadow:0 1px 3px rgba(0,0,0,0.8);pointer-events:none;';st.appendChild(d);});</script><script>(function(){var h=new Date().getHours();var v='night';if(h>=8&&h<17){v='day';}else if((h>=5&&h<8)||(h>=17&&h<20)){v='dusk';}var m=location.search.match(/loading=(day|night|dusk)/);if(m){v=m[1];}var order=[v,'night','day','dusk'];var chosen=null;function paint(){if(!chosen){return;}var el=document.getElementById('status');if(!el){return;}el.style.backgroundImage='linear-gradient(rgba(10,9,14,0.10),rgba(10,9,14,0.30)),url('+chosen+')';el.style.backgroundSize='contain';el.style.backgroundPosition='center';el.style.backgroundRepeat='no-repeat';}function tryAt(i){if(i>=order.length){return;}var f='loading_'+order[i]+'.webp';var im=new Image();im.onload=function(){chosen=f;paint();};im.onerror=function(){tryAt(i+1);};im.src=f;}tryAt(0);document.addEventListener('DOMContentLoaded',paint);})();</script>"
